name: SSD firsat takip

on:
  # DURDURULDU: forum GitHub makinelerini Cloudflare ile engelliyor (HTTP 403).
  # Engel kalkarsa asagidaki satirlarin basindaki # isaretlerini kaldir.
  # schedule:
  #   - cron: "*/15 * * * *"
  # push:
  #   branches: [main]
  #   paths-ignore: ["state/**", "README.md"]
  workflow_dispatch:
    inputs:
      test_bildirimi:
        description: "Sadece test bildirimi gonder"
        type: boolean
        default: false

permissions:
  contents: write

# Ayni anda tek izleyici calisir; sonraki sirada bekler ve biten devralir
concurrency:
  group: ssd-takip
  cancel-in-progress: false

jobs:
  takip:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Git ayarlari
        run: |
          git config user.name "ssd-takip-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Test / baslangic bildirimi
        if: ${{ inputs.test_bildirimi || github.event_name == 'push' }}
        run: python3 bot.py ping
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Forumu izle (10 sn arayla, ~5 sa 40 dk)
        if: ${{ !inputs.test_bildirimi }}
        run: python3 -u bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_SECONDS: "20400"
          INTERVAL: "10"
